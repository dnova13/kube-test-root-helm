{{- /* values의 configMaps 항목마다 ConfigMap 하나를 만든다. 환경별 접속 주소는 values-<환경>.yaml에서 바꾼다 */ -}}
{{- range $name, $data := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "sns.labels" $ | nindent 4 }}
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
