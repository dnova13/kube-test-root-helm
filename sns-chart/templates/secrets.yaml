{{- /* secrets.create=true일 때만 만든다. 값은 git에 없는 values-secret.yaml로 넘긴다 */ -}}
{{- if .Values.secrets.create }}
{{- range $name, $data := .Values.secrets.items }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sns.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
