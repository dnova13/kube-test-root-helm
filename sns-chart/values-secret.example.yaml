# Secret을 차트로 만들 때(secrets.create=true) 쓰는 예시. 실제 값은 이 파일을 복사한 values-secret.yaml에 적고,
# values-secret.yaml은 git에 올리지 않는다 (루트 .gitignore에 등록됨).
#   cp sns-chart/values-secret.example.yaml sns-chart/values-secret.yaml
#   helm upgrade --install ... -f sns-chart/values-dev.yaml -f sns-chart/values-secret.yaml
# 클러스터에 mysql-secret 등이 이미 있으면 이 파일은 필요 없다 (secrets.create 기본값 false).
secrets:
  create: true
  items:
    mysql-secret:
      MYSQL_USER: "<DB 사용자>"
      MYSQL_PASSWORD: "<DB 비밀번호>"
    kafka-secret:
      KAFKA_USER: "<Kafka 사용자>"
      KAFKA_PASSWORD: "<Kafka 비밀번호>"
    email-secret:
      SMTP_USER: "<SES SMTP 사용자>"
      SMTP_PASSWORD: "<SES SMTP 비밀번호>"
